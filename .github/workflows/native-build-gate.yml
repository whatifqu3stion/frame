name: Native Build Gate

on:
  pull_request:
    paths:
      - ".github/workflows/native-build-gate.yml"
      - "expo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        run: bunx expo prebuild --platform android --no-install

      - name: Compile debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frame-android-debug
          path: expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Compile Simulator app
        run: |
          xcodebuild \
            -workspace ios/Frame.xcworkspace \
            -scheme Frame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: frame-ios-simulator
          path: expo/ios/build/Build/Products/Debug-iphonesimulator/Frame.app
          if-no-files-found: error
          retention-days: 7
